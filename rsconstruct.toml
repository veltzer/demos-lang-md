# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# The Makefile rendered each src/*.md to a PDF with `pandoc -o out/x.pdf`
# (markdown lint and spellcheck are covered by rumdl and zspell, which already
# scan src here). The pandoc processor produces the PDF; formats is pdf-only to
# match the Makefile.
[processor.pandoc.md]
src_dirs = ["src"]
formats = ["pdf"]

# pandoc's PDF path uses pdflatex, absent from the runner by default (CI would
# fail "pdflatex not found"). texlive-latex-recommended provides it; -extra
# adds booktabs/longtable that the table demo's markdown table needs.
[dependencies]
system = [
    "texlive-latex-recommended",
    "texlive-latex-extra",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
